<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 226" width="800" height="226" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0c18"/>
      <stop offset="1" stop-color="#171230"/>
    </linearGradient>
    <radialGradient id="glow" cx=".15" cy="0" r=".8">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".25"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset=".5" stop-color="#60a5fa" stop-opacity=".5"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <clipPath id="card"><rect width="800" height="226" rx="16"/></clipPath>
    <clipPath id="typing">
      <rect x="30" y="108" width="0" height="26">
        <animate attributeName="width" values="0;480;480" keyTimes="0;.5;1" dur="5s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    text { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
    .sans { font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .25; } }
    .drift { animation: drift 8s linear infinite; }
    @keyframes drift { to { transform: translateX(-200px); } }
    .fade { opacity: 0; animation: fade .8s ease-out forwards; }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="800" height="226" fill="url(#bg)"/>
    <rect width="800" height="226" fill="url(#glow)"/>
    <path class="drift" fill="none" stroke="url(#wave)" stroke-width="2"
          d="M 0 165 Q 50 135 100 165 T 200 165 T 300 165 T 400 165 T 500 165 T 600 165 T 700 165 T 800 165 T 900 165 T 1000 165"/>
  </g>
  <rect x=".5" y=".5" width="799" height="225" rx="16" fill="none" stroke="#2a2545"/>

  <rect x="30" y="20" width="204" height="26" rx="13" fill="#2a1650" stroke="#6d3bd2"/>
  <circle class="pulse" cx="46" cy="33" r="4" fill="#a78bfa"/>
  <text x="58" y="37" font-size="11" fill="#e0d4ff">Welcome to my digital space</text>

  <text class="sans fade" x="30" y="98" font-size="52" font-weight="800"
        fill="url(#name)" style="animation-delay:.2s">Vinicius Jesus</text>

  <g clip-path="url(#typing)">
    <text x="30" y="128" font-size="15">
      <tspan fill="#38bdf8">&gt; Full Stack Developer</tspan><tspan fill="#6b6b85"> | Creative Interface Builder</tspan>
    </text>
  </g>

  <g font-size="11" fill="#d4d4e0">
    <g class="fade" style="animation-delay:.6s">
      <rect x="30" y="146" width="122" height="26" rx="8" fill="#0f2a22" stroke="#157a55"/>
      <circle class="pulse" cx="44" cy="159" r="3.5" fill="#34d399"/>
      <text x="55" y="163" fill="#34d399">Open to work!</text>
    </g>
    <g class="fade" style="animation-delay:.8s">
      <rect x="160" y="146" width="204" height="26" rx="8" fill="#1c1c2b" stroke="#33334a"/>
      <text x="172" y="163">Living in São Paulo, Brazil</text>
    </g>
    <g class="fade" style="animation-delay:1s">
      <rect x="30" y="180" width="192" height="26" rx="8" fill="#1c1c2b" stroke="#33334a"/>
      <text x="42" y="197">Learning new things daily</text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>