<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 56" width="800" height="56" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0c18"/>
      <stop offset="1" stop-color="#171230"/>
    </linearGradient>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="4" y1="10" x2="44" y2="38">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="360" y1="0" x2="772" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".9"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <style>
    .sans { font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; }
    .glow { opacity: .45; animation: glow 3s ease-in-out infinite; }
    @keyframes glow { 50% { opacity: .15; } }
    .l { animation: left 3s ease-in-out infinite; }
    .r { animation: right 3s ease-in-out infinite; }
    @keyframes left  { 50% { transform: translateX(-2px); } }
    @keyframes right { 50% { transform: translateX(2px); } }
    .s { animation: slash 3s ease-in-out infinite; }
    @keyframes slash { 50% { opacity: .55; } }
  </style>

  <!-- fundo -->
  <rect width="800" height="56" rx="12" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="799" height="55" rx="12" fill="none" stroke="#2a2545"/>

  <!-- ícone </> (28px, centralizado na vertical) -->
  <g transform="translate(22 13.5) scale(.6)" fill="none" stroke="url(#g)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <g class="glow" filter="url(#blur)">
      <polyline points="17,14 5,24 17,34"/>
      <polyline points="31,14 43,24 31,34"/>
      <line x1="28" y1="10" x2="20" y2="38"/>
    </g>
    <polyline class="l" points="17,14 5,24 17,34"/>
    <polyline class="r" points="31,14 43,24 31,34"/>
    <line class="s" x1="28" y1="10" x2="20" y2="38"/>
  </g>

  <!-- título -->
  <text class="sans" x="64" y="35" font-size="20" font-weight="700" fill="#f0f0ff">Redes Sociais</text>

  <!-- linha com brilho viajando -->
  <line x1="220" y1="28" x2="772" y2="28" stroke="url(#line)" stroke-width="2" stroke-linecap="round"/>
  <circle cy="28" r="2.5" fill="#38bdf8">
    <animate attributeName="cx" values="225;772" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;.7;1" dur="3.5s" repeatCount="indefinite"/>
  </circle>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>